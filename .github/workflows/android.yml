name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب الكود من المستودع
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. إعداد بيئة Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. إعداد Java 21 (المطلوب لحزم Capacitor الأخير)
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 4. تثبيت حزم المشروع
      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps || npm install --force

      # 5. بناء تطبيق الويب عبر Vite
      - name: Build Web Application
        run: |
          npx vite build

      # 6. إعداد وتزامن Capacitor
      - name: Configure Capacitor & Add Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          
          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ]; then
            echo '{"appId": "com.mony.app", "appName": "MonyApp", "webDir": "dist"}' > capacitor.config.json
          fi

          rm -rf android
          npx cap add android
          npx cap sync android

      # 7. إعطاء صلاحيات التشغيل
      - name: Grant Executable Permission
        run: |
          chmod +x android/gradlew

      # 8. بناء ملف الـ APK
      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      # 9. رفع الملف للتحميل
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
