name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب الكود من المستودع
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. إعداد بيئة Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. إعداد بيئة Java 17
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. إعداد وتثبيت أدوات أندرويد SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. تثبيت حزم المشروع
      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps || npm install --force

      # 6. بناء تطبيق الويب عبر Vite
      - name: Build Web Application
        run: |
          npx vite build

      # 7. تهيئة Capacitor وإنشاء مجلد أندرويد نظيف
      - name: Configure Capacitor & Add Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          
          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ]; then
            echo '{"appId": "com.mony.app", "appName": "MonyApp", "webDir": "dist"}' > capacitor.config.json
          fi

          rm -rf android
          npx cap add android
          npx cap sync android

      # 8. قبول جميع تراخيص Android SDK تلقائياً
      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # 9. إعطاء صلاحية التشغيل لملف Gradle
      - name: Grant Executable Permission
        run: |
          chmod +x android/gradlew

      # 10. بناء ملف الـ APK
      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      # 11. رفع ملف الـ APK الناتجة للتحميل
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
